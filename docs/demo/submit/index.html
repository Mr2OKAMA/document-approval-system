<h2>文書の申請(新規・改訂)</h2>
<p>既存の文書番号を入力すると次の版(改訂)として下書きを作成します。作成後、内容を確認して「確認依頼」を押すと確認者へ回ります。</p>
<form method="post" action="#" onsubmit="return false" enctype="multipart/form-data"><input type="hidden" name="csrf" value="17cdd3e2e915cb0a0c885d1599ce7a84">
<label>文書番号</label><input type="text" name="doc_no" list="docs" value="" required>
<datalist id="docs"><option value="FRM-001">酸素濃度測定記録票</option><option value="SOP-001">酸素欠乏危険作業 作業手順書</option><option value="SOP-002">高所作業 作業手順書</option><option value="SOP-003">フォークリフト作業手順書</option><option value="SOP-004">玉掛け作業手順書(作成中)</option></datalist>
<fieldset><legend>新規文書のみ入力(既存文書は登録済みの内容を使用)</legend>
<label>名称</label><input type="text" name="title">
<label>分類</label><input type="text" name="category" list="cats" placeholder="例: 規程 / 手順書 / 様式 / 図面 / 契約書 / 議事録"><datalist id="cats"><option value="安全作業"><option value="様式"></datalist>
<label>部署</label><input type="text" name="department" list="deps"><datalist id="deps"><option value="施設部"><option value="物流部"><option value="製造部"></datalist>
<label>見直し周期(月)</label><input type="number" name="review_cycle_months" value="12" min="1" max="120"></fieldset>
<label>改訂内容</label><textarea name="change_summary" rows="3" required></textarea>
<label>改訂理由(必須:新規制定・法改正・事故/ヒヤリハット・業務変更・誤記修正など)</label><textarea name="change_reason" rows="3" required></textarea>
<label>適用開始日</label><input type="date" name="effective_date" value="2026-11-07" required>
<label>PDFファイル(正本・20MBまで)</label><input type="file" name="file" accept="application/pdf" required>
<p><button>下書きを作成</button></p></form></main>
</div></div>

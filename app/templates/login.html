{% extends "base.html" %}{% block body %}
<div class="login"><h1>文書管理システム</h1><p class="sub">作業手順書の版管理・承認・周知</p>
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>ID</label><input type="text" name="login_id" required autofocus autocomplete="username">
<label>パスワード</label><input type="password" name="password" required autocomplete="current-password">
<button>ログイン</button></form></div>{% endblock %}

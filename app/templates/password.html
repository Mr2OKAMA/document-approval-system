{% extends "base.html" %}{% block body %}
<h2>パスワード変更</h2>
<form method="post" action="/password"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>現在のパスワード</label><input type="password" name="current" required>
<label>新しいパスワード(8文字以上)</label><input type="password" name="new" required minlength="8">
<p><button>変更</button></p></form>{% endblock %}
